[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice2face-failure-analysis"
version = "0.1.0"
description = "Failure analysis for diffusion-based voice-to-face generation"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
